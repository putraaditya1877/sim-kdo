services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-simkdo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-simkdo}
      POSTGRES_DB: ${POSTGRES_DB:-sim_kdo}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-simkdo} -d ${POSTGRES_DB:-sim_kdo}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://simkdo:simkdo@db:5432/sim_kdo?sslmode=disable}
      HTTP_ADDR: ${HTTP_ADDR:-:8080}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      MIGRATE_ON_START: ${MIGRATE_ON_START:-true}
      JWT_SECRET: ${JWT_SECRET:-development-only-change-me}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  pgdata:
